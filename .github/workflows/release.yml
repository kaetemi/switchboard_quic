#
# The prebuilt shim of a release: on a tag v* (or by hand for an existing
# tag), `cargo build --release` of native/sbq on each of the five platforms,
# after its `cargo test`, attached to the GitHub release of the tag:
#
#   linux_x64-libsbq.so     linux_arm64-libsbq.so
#   macos_arm64-libsbq.dylib  macos_x64-libsbq.dylib
#   windows_x64-sbq.dll     SHA256SUMS
#
# Release assets have no directories, so each library is named
# <os>_<arch>-<file>; SHA256SUMS lists them as <os>_<arch>/<file>, the layout
# hook/build.dart reads under native/sbq/prebuilt/, where
# tool/fetch_prebuilt.sh puts them after checking them against it (and where
# `sha256sum -c` checks them again). A release the workflow creates stays a
# draft until all five libraries and SHA256SUMS are attached. Builds stage
# Actions artifacts with read-only repository access; only the publish job
# has write access. A published release is verified and never overwritten.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build (v...)
        required: true
        type: string

permissions:
  contents: read

# A second invocation for the same tag must not race the draft's uploads.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Validate tag input
        run: |
          case "$TAG" in v?*) ;; *) echo "expected an existing v... tag" >&2; exit 1 ;; esac
          git check-ref-format "refs/tags/$TAG"
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Pin the source for every build
        id: tag
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux_x64, runner: ubuntu-latest, file: libsbq.so }
          - { platform: linux_arm64, runner: ubuntu-24.04-arm, file: libsbq.so }
          - { platform: macos_arm64, runner: macos-latest, file: libsbq.dylib }
          - { platform: macos_x64, runner: macos-15-intel, file: libsbq.dylib }
          - { platform: windows_x64, runner: windows-latest, file: sbq.dll }
    defaults:
      run:
        shell: bash
    env:
      # Applies to both the tests and DLL, without a VC++ redistributable.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false

      # The action's ref selects the toolchain (it has no version tags).
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test and build
        working-directory: native/sbq
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Describe and stage
        run: |
          library="dist/${{ matrix.platform }}/${{ matrix.file }}"
          mkdir -p "$(dirname "$library")"
          cp "native/sbq/target/release/${{ matrix.file }}" "$library"
          if command -v file > /dev/null; then file "$library" || true; fi
          case "${{ matrix.platform }}" in
            linux_*) echo "glibc symbols up to $(objdump -T "$library" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)" || true ;;
            macos_*) otool -l "$library" | grep -A 4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' || true ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify all assets, then publish
        shell: bash
        run: |
          cd dist
          paths=(linux_arm64/libsbq.so linux_x64/libsbq.so macos_arm64/libsbq.dylib macos_x64/libsbq.dylib windows_x64/sbq.dll)
          # Check names as well as count: no missing platform or stale extra asset.
          [ "$(find . -type f | wc -l)" -eq 5 ] || { echo "expected 5 libraries" >&2; exit 1; }
          sha256sum -- "${paths[@]}" > SHA256SUMS
          cat SHA256SUMS
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" = false ]; then
              # A full rerun is a no-op for a published release. Verify its own
              # bytes, not this rebuild (Rust builds need not be reproducible).
              mkdir existing
              gh release download "$TAG" --dir existing
              (
                cd existing
                [ "$(find . -type f | wc -l)" -eq 6 ]
                for path in "${paths[@]}"; do
                  mkdir -p "${path%/*}"
                  mv "${path%/*}-${path##*/}" "$path"
                done
                sha256sum -- "${paths[@]}" > actual
                cmp SHA256SUMS actual
              )
              echo "Published release verified; unchanged."
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes "The native shim for Linux x64 and arm64, macOS arm64 and x64, and Windows x64; see native/README.md."
          fi
          for path in "${paths[@]}"; do
            cp "$path" "${path%/*}-${path##*/}"
          done
          gh release upload "$TAG" linux_*-libsbq.so macos_*-libsbq.dylib windows_x64-sbq.dll SHA256SUMS --clobber
          # Include the server's asset list in the gate before publication.
          actual=$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          expected=$(printf '%s\n' SHA256SUMS linux_arm64-libsbq.so linux_x64-libsbq.so macos_arm64-libsbq.dylib macos_x64-libsbq.dylib windows_x64-sbq.dll | LC_ALL=C sort)
          [ "$actual" = "$expected" ] || { echo "unexpected release assets" >&2; exit 1; }
          gh release edit "$TAG" --draft=false
