# cbindgen configuration of include/sbq.h:
#   cbindgen --config cbindgen.toml --crate sbq --output include/sbq.h
language = "C"
include_guard = "SBQ_H"
usize_is_size_t = true
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from native/sbq/src; do not edit. */"
header = """/*
Polyverse Switchboard
Microservice Network Architecture
Copyright (C) 2018-2026  Jan BOON (Kaetemi)
Authors:
  Jan Boon <jan.boon@kaetemi.be>
  Claude Opus 5.5 <noreply@anthropic.com>
  GPT-6 Astra <noreply@openai.com>
*/"""
documentation = true
documentation_style = "c99"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[export]
include = ["SbqEvent", "SbqStats"]
