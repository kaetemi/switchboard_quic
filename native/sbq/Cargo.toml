[package]
name = "sbq"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Flat extern \"C\" shim over quinn for the switchboard_quic Dart package"
license = "BSD-3-Clause"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
ring = "0.17"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
