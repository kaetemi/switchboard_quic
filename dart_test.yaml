# `dart test` runs everything on the VM, against the in-memory provider of
# test/fake_provider.dart.
#
# `dart test -P node` runs the tests of `package:switchboard_quic/core.dart`
# (which compiles for the web) compiled to JavaScript on Node.js: the wire
# codecs and their 32 and 48-bit arithmetic, and the connection and channel
# of the binding, as a browser frontend runs them over the web provider.
# The node-level tests (switchboard_test.dart) need dart:io.
presets:
  node:
    platforms: [node]
    paths:
      - test/vectors_test.dart
      - test/binding_test.dart
