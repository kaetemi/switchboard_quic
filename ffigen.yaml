# Bindings of the native shim (native/sbq/include/sbq.h, generated by cbindgen) as @Native
# functions resolved through the code asset that hook/build.dart provides. Regenerate with
#   dart run ffigen --config ffigen.yaml
# and commit lib/src/native/sbq_bindings.g.dart with the header.
name: SbqBindings
description: Bindings of the sbq shim over quinn.
output: lib/src/native/sbq_bindings.g.dart
headers:
  entry-points:
    - native/sbq/include/sbq.h
  include-directives:
    - native/sbq/include/sbq.h
ffi-native:
  asset-id: package:switchboard_quic/sbq
functions:
  include:
    - 'sbq_.*'
  # Leaf calls: short, never waiting on anything the notifier thread holds while it rings the
  # doorbell. sbq_init, sbq_shutdown (waits for a doorbell in progress), the configuration
  # builders, sbq_listen (may resolve a name), sbq_connect and the certificate generator are not.
  leaf:
    include:
      - 'sbq_(abi_version|poll|last_error|sha256|config_free)'
      - 'sbq_listener_.*'
      - 'sbq_conn_.*'
      - 'sbq_stream_.*'
macros:
  include:
    - 'SBQ_.*'
structs:
  include:
    - 'SbqEvent'
    - 'SbqStats'
typedefs:
  include:
    - 'SbqDoorbell'
comments:
  style: any
  length: full
preamble: |
  /*
  Polyverse Switchboard
  Microservice Network Architecture
  Copyright (C) 2018-2026  Jan BOON (Kaetemi)
  Authors:
    Jan Boon <jan.boon@kaetemi.be>
    Claude Opus 5.5 <noreply@anthropic.com>
  */

  // ignore_for_file: type=lint, unused_import
